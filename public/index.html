<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MODx OSINT | Ultimate Intelligence Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen pb-12 text-slate-200">

  <!-- Header -->
  <header class="text-center py-10 fade-in relative z-10">
    <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-2">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 drop-shadow-[0_0_15px_rgba(168,85,247,0.5)]">
        MODx OSINT
      </span>
    </h1>
    <p class="text-slate-400 font-mono text-sm md:text-base tracking-widest uppercase">Ultimate Intelligence & Extraction Engine</p>
  </header>

  <main class="max-w-5xl mx-auto px-4 relative z-10">
    
    <!-- Main Input Terminal -->
    <section class="glass-panel rounded-2xl p-6 md:p-8 mb-8 fade-in">
      <div class="relative">
        <i class="fa-solid fa-terminal absolute left-4 top-4 text-purple-500"></i>
        <input type="text" id="osintInput" placeholder="Enter Username, Email, Phone, IP Address..." 
               class="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl py-4 pl-12 pr-4 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/50 transition-all font-mono">
      </div>
      
      <div class="flex flex-col md:flex-row justify-between items-center mt-4 gap-4">
        <div class="flex items-center gap-3">
          <span class="text-xs text-slate-500 font-mono uppercase">Or upload target image:</span>
          <input type="file" id="fileInput" accept="image/*" class="hidden" />
          <button id="uploadBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm transition-colors border border-slate-700">
            <i class="fa-solid fa-upload"></i> Select Image
          </button>
        </div>
        <button id="scanBtn" class="w-full md:w-auto bg-purple-600 hover:bg-purple-500 text-white font-bold px-8 py-3 rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all transform hover:scale-105">
          <i class="fa-solid fa-radar"></i> Initiate Scan
        </button>
      </div>
    </section>

    <!-- Results Dashboard -->
    <section id="resultsSection" class="hidden fade-in">
      <!-- Navigation Tabs -->
      <div class="flex space-x-2 border-b border-slate-700 mb-6 overflow-x-auto pb-2">
        <button class="tab-btn active whitespace-nowrap pb-2 px-4 font-semibold text-slate-300 hover:text-white transition-colors" data-tab="extracted"><i class="fa-solid fa-database"></i> Extracted Data</button>
        <button class="tab-btn whitespace-nowrap pb-2 px-4 font-semibold text-slate-300 hover:text-white transition-colors" data-tab="ai"><i class="fa-solid fa-brain"></i> AI Analysis</button>
        <button class="tab-btn whitespace-nowrap pb-2 px-4 font-semibold text-slate-300 hover:text-white transition-colors" data-tab="tools"><i class="fa-solid fa-toolbox"></i> Advanced Tools</button>
      </div>

      <!-- Tab: Extracted Data -->
      <div id="tab-extracted" class="tab-content block">
        <div id="extractedOutput"></div>
      </div>

      <!-- Tab: AI Analysis -->
      <div id="tab-ai" class="tab-content hidden">
        <div class="glass-panel rounded-xl p-6">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse" id="aiStatusDot"></div>
            <span id="aiStatusText" class="text-sm font-semibold text-slate-300 font-mono">AI Engine Standby...</span>
          </div>
          <div id="aiOutput" class="font-mono text-sm text-slate-300 whitespace-pre-wrap"></div>
        </div>
      </div>

      <!-- Tab: Tools Directory -->
      <div id="tab-tools" class="tab-content hidden">
        <div id="toolsOutput" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <!-- Global Tools Directory (Always visible if no scan) -->
    <section id="globalTools" class="mt-12 fade-in">
      <h2 class="text-2xl font-bold mb-6 text-slate-300 border-l-4 border-purple-500 pl-3">Global OSINT Arsenal</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="globalToolsList">
        <!-- Populated via JS -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
