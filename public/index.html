<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoShield Pro | OSINT & Metadata</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- EXIF Extraction -->
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <!-- EXIF Removal -->
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .font-mono { font-family: 'Fira Code', monospace; }
    
    /* Smooth Animations */
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Glassmorphism */
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    
    /* Dropzone Hover */
    .dropzone-hover { border-color: #8b5cf6 !important; background: rgba(139, 92, 246, 0.1) !important; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    /* Tabs */
    .tab-btn { transition: all 0.3s; border-bottom: 2px solid transparent; }
    .tab-btn.active { border-bottom: 2px solid #8b5cf6; color: #8b5cf6; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="text-center py-10 fade-in">
    <h1 class="text-4xl md:text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600 mb-2">
      <i class="fa-solid fa-shield-halved"></i> PhotoShield Pro
    </h1>
    <p class="text-slate-400 text-sm md:text-base">Advanced Metadata Extractor, OSINT & Privacy Protector</p>
  </header>

  <main class="max-w-4xl mx-auto px-4">
    
    <!-- Upload Area -->
    <section id="uploadSection" class="glass rounded-2xl p-8 mb-8 fade-in transition-all duration-300 shadow-xl shadow-purple-900/20">
      <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-xl p-10 text-center cursor-pointer transition-all duration-300">
        <i class="fa-solid fa-cloud-arrow-up text-4xl text-purple-500 mb-4 animate-bounce"></i>
        <p class="text-lg font-semibold mb-2">Drag & drop your photos here</p>
        <p class="text-slate-400 text-sm mb-4">or click to browse (Max 20 files)</p>
        <input type="file" id="fileInput" class="hidden" multiple accept="image/*" />
        <button class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">Select Files</button>
      </div>
    </section>

    <!-- Results Area -->
    <section id="resultsSection" class="hidden fade-in">
      
      <!-- Tabs -->
      <div class="flex space-x-4 border-b border-slate-700 mb-6">
        <button class="tab-btn active pb-3 px-2 font-semibold text-slate-300 hover:text-white" data-tab="metadata"><i class="fa-solid fa-code"></i> Raw Data</button>
        <button class="tab-btn pb-3 px-2 font-semibold text-slate-300 hover:text-white" data-tab="osint"><i class="fa-solid fa-user-secret"></i> OSINT & Hashes</button>
        <button class="tab-btn pb-3 px-2 font-semibold text-slate-300 hover:text-white" data-tab="ai"><i class="fa-solid fa-robot"></i> AI Analysis</button>
        <button class="tab-btn pb-3 px-2 font-semibold text-slate-300 hover:text-white" data-tab="protect"><i class="fa-solid fa-eraser"></i> Protect</button>
      </div>

      <!-- Raw Data Tab -->
      <div id="tab-metadata" class="tab-content block">
        <div class="flex justify-end gap-3 mb-4">
          <button id="downloadJsonBtn" class="text-sm bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg transition-colors"><i class="fa-solid fa-download"></i> Download JSON</button>
        </div>
        <div id="metadataOutput" class="glass rounded-xl p-6 font-mono text-sm overflow-auto max-h-[600px] text-green-400"></div>
      </div>

      <!-- OSINT Tab -->
      <div id="tab-osint" class="tab-content hidden">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Hashes -->
          <div class="glass rounded-xl p-6">
            <h3 class="text-xl font-bold mb-4 text-purple-400"><i class="fa-solid fa-fingerprint"></i> File Hashes</h3>
            <div id="hashOutput" class="space-y-3 font-mono text-xs text-slate-300 break-all"></div>
          </div>
          <!-- Reverse Search -->
          <div class="glass rounded-xl p-6">
            <h3 class="text-xl font-bold mb-4 text-purple-400"><i class="fa-solid fa-magnifying-glass"></i> Reverse Search</h3>
            <p class="text-sm text-slate-400 mb-4">Image ko in platforms par drag karke search karein:</p>
            <div class="flex flex-col gap-3">
              <a href="https://lens.google.com/" target="_blank" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg flex items-center gap-3 transition-colors"><i class="fa-brands fa-google text-red-400"></i> Google Lens</a>
              <a href="https://yandex.com/images/" target="_blank" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg flex items-center gap-3 transition-colors"><i class="fa-solid fa-magnifying-glass text-yellow-400"></i> Yandex Images</a>
              <a href="https://tineye.com/" target="_blank" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-lg flex items-center gap-3 transition-colors"><i class="fa-solid fa-leaf text-green-400"></i> TinEye</a>
            </div>
          </div>
          <!-- GPS Map -->
          <div class="glass rounded-xl p-6 md:col-span-2" id="gpsSection" style="display:none;">
            <h3 class="text-xl font-bold mb-4 text-purple-400"><i class="fa-solid fa-map-l
